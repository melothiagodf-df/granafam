<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Nosso Bolso</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nosso Bolso">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1F5C4A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#E6E2D8; --bg:#F4F1EA; --surface:#FBFAF6; --line:#E2DDD1; --line-soft:#EEEAE0;
  --ink:#1B1A17; --ink-2:#3D3A33; --muted:#6B665C; --muted-2:#8A8579;
  --accent:#1F5C4A; --accent-ink:#F4F1EA; --accent-soft:#E4EEE9; --accent-sub:#CFE3DA;
  --warn:#B5542E; --warn-ink:#A0461F; --warn-soft:#F6E6DE; --warn-2:#C9795A; --warn-3:#D9A58C;
  --calm:#5E8C7D; --night:#1B1A17; --night-ink:#F4F1EA; --night-sub:#C9C4B8; --mint:#9FD3BE;
  --track:#E7E2D7;
  --f-display:'Fraunces',Georgia,'Times New Roman',serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E0F0D; --bg:#151714; --surface:#1D201C; --line:#2E322C; --line-soft:#262924;
    --ink:#ECE8DF; --ink-2:#D2CEC4; --muted:#A39E92; --muted-2:#8B867B;
    --accent:#2C7A62; --accent-ink:#F4F1EA; --accent-soft:#1E3A31; --accent-sub:#BFE0D2;
    --warn:#D8764E; --warn-ink:#EE9A77; --warn-soft:#3A2519; --warn-2:#B8704F; --warn-3:#8E5E47;
    --calm:#5E9C88; --night:#0B0C0A; --night-ink:#ECE8DF; --night-sub:#A9A497; --mint:#8CCBB2;
    --track:#2C302A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E0F0D; --bg:#151714; --surface:#1D201C; --line:#2E322C; --line-soft:#262924;
  --ink:#ECE8DF; --ink-2:#D2CEC4; --muted:#A39E92; --muted-2:#8B867B;
  --accent:#2C7A62; --accent-ink:#F4F1EA; --accent-soft:#1E3A31; --accent-sub:#BFE0D2;
  --warn:#D8764E; --warn-ink:#EE9A77; --warn-soft:#3A2519; --warn-2:#B8704F; --warn-3:#8E5E47;
  --calm:#5E9C88; --night:#0B0C0A; --night-ink:#ECE8DF; --night-sub:#A9A497; --mint:#8CCBB2;
  --track:#2C302A;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.shell{min-height:100%;display:flex}
.app{max-width:460px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;padding-bottom:110px;flex:1;min-width:0}
.wrap{padding-inline:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.dash{padding-inline:18px;margin-top:8px;display:flex;flex-direction:column;gap:12px}

/* menu lateral (computador) */
.side{display:none;flex-direction:column;gap:4px;width:232px;flex:none;padding:24px 14px;border-right:1px solid var(--line);background:var(--surface)}
.side .sbrand{font-family:var(--f-display);font-weight:600;color:var(--accent);font-size:20px;padding:2px 12px 22px}
.side a,.side button.snav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--ink-2);font-weight:600;font-size:14px;text-decoration:none;background:none;border:none;text-align:left}
.side button.snav.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.side .sspacer{flex:1}
.side .snew{margin:8px 4px 14px;height:46px;border-radius:12px;border:none;background:var(--ink);color:var(--bg);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}

/* layout do dashboard em telas largas */
@media (min-width:860px){
  .side{display:flex}
  .app{max-width:none;padding-bottom:40px}
  .wrap,.dash{padding-inline:36px;max-width:1180px}
  .top{padding:28px 36px 6px}
  .section-l{padding-inline:36px}
  .chips{padding-inline:36px}
  .dash{display:grid;grid-template-columns:1.15fr 1fr;grid-template-areas:"hero cards" "banner banner" "agenda termo" "agenda metas";align-items:start;gap:16px}
  .a-banner{grid-area:banner}
  .a-hero{grid-area:hero}
  .a-cards{grid-area:cards;padding-top:0}
  .a-cards .section-l{padding:0 0 8px}
  .a-cards .hscroll{padding:2px 0 6px}
  .a-agenda{grid-area:agenda}
  .a-termo{grid-area:termo}
  .a-metas{grid-area:metas}
  .sheet-bg{align-items:center}
  .sheet{max-width:520px;border-radius:20px;max-height:88vh}
  .eyebrow{display:none}
  .top .icon-btn[aria-label="Voltar"]{display:none}
  .top .icon-btn[aria-label="Ajustes"]{display:none}
}

/* cabeçalho */
.top{padding:18px 18px 4px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.3px}
.brand{font-family:var(--f-display);font-weight:600;color:var(--accent);font-size:13px}
.h1{font-family:var(--f-display);font-size:28px;font-weight:600;margin:0;text-wrap:balance}
.icon-btn{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink-2)}

/* seletor de competência (pill com setas) */
.compdd{position:relative;display:inline-flex;align-items:center;gap:2px;max-width:100%}
.comp-pill{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;height:34px;padding:0 8px 0 14px;margin:0;color:var(--ink);
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-family:var(--f-body);font-weight:700;font-size:13px;box-shadow:0 1px 2px rgba(20,18,15,.05);transition:background .12s ease,border-color .12s ease;max-width:100%}
.comp-pill span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comp-pill:hover{background:var(--line-soft)}
.comp-pill.open{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.comp-pill.big{height:44px;padding:0 12px 0 18px;font-family:var(--f-display);font-size:19px;font-weight:600;border-radius:16px;gap:10px}
.comp-pill .chev-wrap{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--line-soft);color:var(--muted-2);flex:none;transition:transform .15s ease}
.comp-pill.open .chev-wrap{background:var(--accent);color:var(--accent-ink);transform:rotate(180deg)}
.comp-step{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.comp-step:hover{background:var(--line-soft)}
.compdd.big .comp-step{width:38px;height:38px}
.compdd-list{position:absolute;top:calc(100% + 8px);left:0;z-index:15;min-width:200px;max-height:min(60vh,340px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 34px rgba(20,18,15,.18);padding:6px;display:flex;flex-direction:column;gap:2px}
.compdd.big .compdd-list{left:44px}
.compdd-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:none;background:none;font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.compdd-item:hover{background:var(--line-soft)}
.compdd-item.on{background:var(--accent-soft);color:var(--accent)}

/* blocos */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.panel-t{font-size:14px;font-weight:700}
.link{background:none;border:none;padding:4px 0;color:var(--accent);font-weight:700;font-size:12px}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.hero .lbl{font-size:13px;font-weight:600;color:var(--accent-sub)}
.hero .big{display:flex;align-items:baseline;gap:6px}
.hero .big .cur{font-family:var(--f-mono);font-size:18px;color:var(--accent-sub)}
.hero .big .v{font-family:var(--f-display);font-size:50px;font-weight:600;line-height:1;letter-spacing:-1px}
.hero.neg{background:var(--warn)}
.seg-bar{height:8px;border-radius:4px;background:rgba(244,241,234,.18);display:flex;overflow:hidden}
.seg-bar i{display:block;height:100%}
.brk{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--accent-sub)}
.brk div{display:flex;justify-content:space-between;gap:10px}
.brk b{font-family:var(--f-mono);font-weight:400;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.brk .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.note{font-size:12px;color:var(--muted);line-height:1.45}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 12px;font-size:12px;font-weight:600}

/* linhas */
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .t{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:11px;color:var(--muted)}
.row .v{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .v.pos{color:var(--accent)}
.row.hl{background:var(--accent-soft);border-radius:10px;padding-inline:10px;margin-inline:-10px;width:calc(100% + 20px);border-bottom-color:transparent}
.row.hl .t,.row.hl .v,.row.hl .date{color:var(--accent)}
.date{width:44px;flex:none;font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.av{width:30px;height:30px;flex:none;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.av.T{background:var(--accent)} .av.N{background:var(--warn)} .av.in{background:var(--accent-soft);color:var(--accent)}
.tag{font-size:10px;font-weight:700;letter-spacing:.3px;padding:2px 7px;border-radius:5px;background:var(--line-soft);color:var(--muted);white-space:nowrap}
.chip-status{font-size:10px;font-weight:700;letter-spacing:.4px;padding:3px 8px;border-radius:20px;white-space:nowrap}
.st-aberta{background:var(--line-soft);color:var(--muted)}
.st-fechada{background:var(--warn-soft);color:var(--warn-ink)}
.st-vencida{background:var(--warn);color:#fff}
.st-paga{background:var(--accent-soft);color:var(--accent)}

/* cartões carrossel */
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:2px 18px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.ccard{flex:0 0 220px;scroll-snap-align:start;border-radius:16px;padding:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:9px;text-align:left}
.ccard.best{background:var(--night);color:var(--night-ink);border-color:var(--night)}
.ccard .nm{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.ccard .amt{font-family:var(--f-mono);font-size:20px}
.ccard .sub{font-size:11px;color:var(--muted);line-height:1.45}
.ccard.best .sub{color:var(--night-sub)}
.badge-best{font-size:10px;font-weight:700;letter-spacing:.4px;color:var(--night);background:var(--mint);padding:3px 8px;border-radius:20px;white-space:nowrap}
.track{height:5px;border-radius:3px;background:var(--track);overflow:hidden}
.track i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.ccard.best .track{background:rgba(244,241,234,.2)} .ccard.best .track i{background:var(--mint)}

/* barras */
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}
.bars .col{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;min-width:0;background:none;border:none;padding:0;font:inherit}
.bars button.col{cursor:pointer}
.bars .col .bv{font-family:var(--f-mono);font-size:10px;color:var(--ink-2)}
.bars .col .bv.neg{color:var(--warn-ink)}
.bars .col .b{width:100%;border-radius:6px 6px 2px 2px;min-height:3px}
.bars .col .bl{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-transform:uppercase}
.bars .col.on .bv,.bars .col.on .bl{color:var(--accent);font-weight:500}

/* metas */
.meta{display:flex;flex-direction:column;gap:6px;padding:6px 0}
.meta .l{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.meta .l span:first-child{font-weight:600}
.meta .l .mono{font-size:12px;color:var(--ink-2)}
.meta.alert .l .mono{color:var(--warn-ink);font-weight:500}
.meta.alert .track i{background:var(--warn)}
.meta.over .track i{background:var(--warn-ink)}
.meta-edit{display:flex;align-items:center;gap:6px}
.meta-edit input{width:88px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 8px;text-align:right;font-family:var(--f-mono);font-size:12px}

/* filtros */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.cardpick{height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;line-height:1.15;white-space:nowrap;font-weight:600;font-size:13px}
.cardpick small{font-family:var(--f-mono);font-size:10px;color:var(--muted);font-weight:400}
.cardpick.on{background:var(--night);color:var(--night-ink);border-color:var(--night)}
.cardpick.on small{color:var(--night-sub)}
.section-l{padding:18px 18px 6px;display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}

/* fatura escura */
.fat{background:var(--night);color:var(--night-ink);border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.fat .big{font-family:var(--f-display);font-size:38px;font-weight:600;line-height:1.05}
.fat .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:12px;border-top:1px solid rgba(244,241,234,.15)}
.fat .k{font-size:10px;letter-spacing:.4px;color:var(--night-sub);text-transform:uppercase}
.fat .kv{font-family:var(--f-mono);font-size:13px}
.fat .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--night-sub)}
.btn-ghost{height:44px;border-radius:12px;border:1px solid rgba(244,241,234,.3);background:none;color:var(--night-ink);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-ghost.done{background:var(--mint);color:var(--night);border-color:var(--mint)}

/* abas */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,460px);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.tab{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11px;font-weight:600;padding:6px 0;min-height:48px}
.tab.on{color:var(--accent);font-weight:700}
.fab{justify-self:center;width:56px;height:56px;margin-top:-30px;border-radius:18px;background:var(--ink);border:none;display:flex;align-items:center;justify-content:center;color:var(--bg);box-shadow:0 6px 16px rgba(0,0,0,.25)}
@media (min-width:860px){ .tabbar{display:none} }

/* folha (modal) */
.sheet-bg{position:fixed;inset:0;background:rgba(10,10,8,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(100%,460px);max-height:92%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.sheet-h h2{font-family:var(--f-display);font-size:22px;margin:0}
.segm{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--line-soft);padding:4px;border-radius:12px}
.segm.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.segm button{height:38px;border:none;border-radius:9px;background:none;font-weight:600;font-size:13px;color:var(--ink-2)}
.segm button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.inp{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:15px;width:100%;min-width:0}
textarea.inp{height:auto;min-height:70px;padding:10px 12px;resize:vertical}
.inp.money{font-family:var(--f-mono);font-size:20px}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.preview{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:12px 14px;font-size:13px;font-weight:600;line-height:1.45}
.preview small{display:block;font-weight:500;opacity:.85;margin-top:2px}
.btns{display:flex;gap:8px}
.btn{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;padding:0 14px;flex:1}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--warn-ink);flex:0 0 auto}
.btn.danger.arm{background:var(--warn);color:#fff;border-color:var(--warn)}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;z-index:30;max-width:90%;text-align:center}
.edit-row{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px 40px;gap:8px;align-items:end;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.edit-row .inp{height:40px;font-size:14px}
.empty{padding:18px 0;color:var(--muted);font-size:13px;text-align:center}
@media (prefers-reduced-motion: no-preference){ .sheet{animation:up .22s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}} }
</style>
</head>
<body>

<div class="shell">
  <nav class="side" aria-label="Navegação">

function parts(s){return s.split('-').map(Number);}
function addM(c,n){const [y,m]=parts(c);const t=new Date(Date.UTC(y,m-1+n,1));return t.getUTCFullYear()+'-'+p2(t.getUTCMonth()+1);}
function diffM(a,b){const [ay,am]=parts(a),[by,bm]=parts(b);return (by*12+bm)-(ay*12+am);}
function addD(s,n){const [y,m,d]=parts(s);const t=new Date(Date.UTC(y,m-1,d+n));return t.getUTCFullYear()+'-'+p2(t.getUTCMonth()+1)+'-'+p2(t.getUTCDate());}
function daysBetween(a,b){const [ay,am,ad]=parts(a),[by,bm,bd]=parts(b);return Math.round((Date.UTC(by,bm-1,bd)-Date.UTC(ay,am-1,ad))/864e5);}

function fechamentoDe(card,iso){const [y,m,d]=parts(iso);return d<=card.fecha?mk(y,m,card.fecha):mk(y,m+1,card.fecha);}
function vencDoFechamento(card,close){const [y,m]=parts(close);return card.vence>card.fecha?mk(y,m,card.vence):mk(y,m+1,card.vence);}

// compOffset: alguns cartões (ex.: BRB, que vence dia 20 — o mesmo dia do salário do Thiago) têm sua
// competência empurrada +1 mês, pra casar com o salário que efetivamente paga aquela fatura.
function rawComp(card,comp){return addM(comp,-(card.compOffset||0));}
function faturaDe(card,iso){return addM(vencDe(card,iso).slice(0,7),card.compOffset||0);}
function closeDaFatura(card,comp){const r=rawComp(card,comp);const [y,m]=parts(r);return card.vence>card.fecha?mk(y,m,card.fecha):mk(y,m-1,card.fecha);}
function openDaFatura(card,comp){return addD(closeDaFatura(card,addM(comp,-1)),1);}
function vencDaFatura(card,comp){const r=rawComp(card,comp);const [y,m]=parts(r);return mk(y,m,card.vence);}

function startFirebaseSync(){
  if(!fbRef)return;
  fbRef.once('value').then(snap=>{
    const data=snap.val();

    else pushFirebase(); // Firebase vazio — sobe os dados locais como defaults
    fbRef.on('value',snap2=>{

}
const cardById=id=>S.cards.find(c=>c.id===id)||null;

/* ───────── ocorrências de uma competência ───────── */
let memo={};
function occs(comp){
  if(memo[comp])return memo[comp];
  const out=[];
  for(const L of S.lanc){
    const card=cardById(L.conta);
    if(L.tipo==='gasto'){
      const f=card?faturaDe(card,L.data):L.data.slice(0,7);
      if(f===comp)out.push({kind:'gasto',L,valor:L.valor,data:L.data,sinal:-1,conta:card?card.id:'conta'});
    }else if(L.tipo==='parcelado'){
      const f1=L.fatura1||(card?faturaDe(card,L.data):L.data.slice(0,7));
      const i=diffM(f1,comp);
      if(i>=0&&i<L.n){
        const v=(L.valores&&L.valores[i]!=null)?L.valores[i]:L.valor;
        out.push({kind:'parcela',L,valor:v,i,data:card?vencDaFatura(card,comp):mk(...parts(comp),parts(L.data)[2]),sinal:-1,conta:card?card.id:'conta',label:(i+1)+' de '+L.n});
      }
    }else if(L.tipo==='fixo'){
      for(let k=-2;k<=0;k++){
        const m=addM(comp,k);
        if(m<L.inicio||(L.fim&&m>L.fim))continue;
        const [y,mm]=parts(m);const d=mk(y,mm,L.dia);
        if(card){if(faturaDe(card,d)===comp)out.push({kind:'fixo',L,valor:L.valor,data:d,sinal:-1,conta:card.id});}
        else if(k===0)out.push({kind:'fixo',L,valor:L.valor,data:d,sinal:-1,conta:'conta'});
      }
    }else if(L.tipo==='entrada'){
      // compOffset: o salário do Thiago (dia 20) é considerado parte da competência do mês seguinte
      // (junto com o salário da Nataly, que cai no dia 1 desse mês seguinte).
      const off=L.compOffset||0,raw=addM(comp,-off);
      if(raw>=L.inicio&&(!L.fim||raw<=L.fim)){const [y,mm]=parts(raw);out.push({kind:'entrada',L,valor:L.valor,data:mk(y,mm,L.dia),sinal:1,conta:'conta'});}
    }
  }
  return (memo[comp]=out);
}
function totais(comp){
  const o=occs(comp);let ent=0,parc=0,fix=0,gas=0;
  o.forEach(x=>{if(x.sinal>0)ent+=x.valor;else if(x.kind==='parcela')parc+=x.valor;else if(x.kind==='fixo')fix+=x.valor;else gas+=x.valor;});
  return {ent,parc,fix,gas,saidas:parc+fix+gas};
}
function fatura(card,comp){
  const itens=occs(comp).filter(x=>x.sinal<0&&x.conta===card.id);
  const total=itens.reduce((a,x)=>a+x.valor,0);
  const close=closeDaFatura(card,comp),open=openDaFatura(card,comp),venc=vencDaFatura(card,comp);
  const paga=!!S.pagos[card.id+'|'+comp];
  const status=paga?'paga':(HOJE<=close?'aberta':(HOJE>venc?'vencida':'fechada'));
  return {card,comp,itens,total,close,open,venc,paga,status};
}

function pagaCom(venc){
  // busca direto nas entradas recorrentes pela DATA REAL (não pela competência, que pode estar
  // deslocada por compOffset) — evita confundir "em que balde cai" com "quando o dinheiro entra".
  const c=venc.slice(0,7);let best=null;
  [addM(c,-1),c].forEach(m=>{
    S.lanc.filter(L=>L.tipo==='entrada').forEach(L=>{
      if(m>=L.inicio&&(!L.fim||m<=L.fim)){
        const [y,mm]=parts(m);const d=mk(y,mm,L.dia);
        if(d<=venc&&(!best||d>best.data))best={kind:'entrada',L,valor:L.valor,data:d,sinal:1,conta:'conta'};
      }
    });
  });
  return best;
}
function parcelasPorComp(c){return occs(c).filter(x=>x.kind==='parcela').reduce((a,x)=>a+x.valor,0);}
function sugereCat(desc){
  const d=desc.toLowerCase();
  const R=[[/fralda|pampers|huggies|lenço/,'Fralda'],[/leite|nan\b|aptamil|fórmula|formula/,'Leite'],[/mercado|super|atacad|feira|padaria|hortifruti/,'Mercado'],
    [/combust|gasolina|posto/,'Gasolina'],[/uber|99|estaciona|ônibus|metr/,'Transporte'],[/farm|drog/,'Farmácia'],[/médic|medic|consulta|exame/,'Saúde'],
    [/restaurante|ifood|cinema|bar\b|pizza|lanche|show|viagem/,'Lazer'],[/escola|curso|livro/,'Educação'],[/luz|água|agua|internet|aluguel|condom/,'Casa']];
  for(const [re,c] of R)if(re.test(d))return c;return null;
}

function vInicio(){
  const c=ui.comp,t=totais(c),res=S.reserva.mensal||0;
  const livre=t.ent-t.saidas-res;
  const base=Math.max(t.ent,t.saidas+res,1);
  const w=v=>(Math.max(0,v)/base*100).toFixed(1)+'%';
  // dias até o último fechamento dessa competência
  let fim=null;S.cards.forEach(cd=>{const cl=closeDaFatura(cd,c);if(cl>=HOJE&&(!fim||cl>fim))fim=cl;});
  const [cy,cm]=parts(c);const fimMes=mk(cy,cm+1,0).slice(0,8)+'01';
  if(!fim){const eom=addD(mk(cy,cm+1,1),-1);if(eom>=HOJE)fim=eom;}
  const dias=fim?Math.max(1,daysBetween(HOJE,fim)):0;
  let porDia;
  if(!fim)porDia='Mês já fechado — só consulta.';
  else if(livre>0)porDia='≈ R$ '+brl0(livre/dias)+'/dia até '+ddmm(fim);
  else porDia='Passou R$ '+brl0(-livre)+' do que cabe';
  const MNS=mesNome(c);
  let h=head(compTrigger(c,'comp-inicio',true),
    '<button class="icon-btn" data-act="tab" data-v="ajustes" aria-label="Ajustes">'+I.gear+'</button>');
  h+='<div class="dash">';
  if(S.exemplo)h+='<div class="banner a-banner"><span>Simulação com dados de exemplo</span><button class="link" data-act="tab" data-v="ajustes">Ajustar</button></div>';
  h+='<section class="hero a-hero'+(livre<0?' neg':'')+'"><div class="lbl">Livre para gastar em '+MNS+'</div>'+
     '<div class="big"><span class="cur">R$</span><span class="v">'+(livre<0?'−':'')+brl0(Math.abs(livre))+'</span></div>'+
     '<div class="seg-bar"><i style="width:'+w(t.parc)+';background:#E7A184"></i><i style="width:'+w(t.fix)+';background:#C9D9D1"></i><i style="width:'+w(t.gas)+';background:#F4F1EA"></i><i style="width:'+w(res)+';background:rgba(244,241,234,.45)"></i></div>'+
     '<div class="brk"><div><span>Entradas do mês</span><b>'+brl0(t.ent)+'</b></div>'+
     '<div><span><i class="dot" style="background:#E7A184"></i>Parcelas (todos os cartões)</span><b>−'+brl0(t.parc)+'</b></div>'+
     '<div><span><i class="dot" style="background:#C9D9D1"></i>Fixos</span><b>−'+brl0(t.fix)+'</b></div>'+
     '<div><span><i class="dot" style="background:#F4F1EA"></i>Gastos já feitos</span><b>−'+brl0(t.gas)+'</b></div>'+
     '<div><span><i class="dot" style="background:rgba(244,241,234,.45)"></i>Reserva do mês</span><b>−'+brl0(res)+'</b></div></div>'+
     '<div style="font-size:12px;font-weight:700">'+porDia+'</div></section>';

  // próximas datas
  const ev=[];const lim=addD(HOJE,40);const c0=HOJE.slice(0,7);
  for(let k=0;k<=2;k++){const m=addM(c0,k);
    occs(m).forEach(x=>{if(x.data>=HOJE&&x.data<=lim){if(x.kind==='entrada')ev.push({d:x.data,t:x.L.desc,v:x.valor,pos:1});else if(x.conta==='conta'&&x.kind!=='gasto')ev.push({d:x.data,t:x.L.desc,v:x.valor});}});
    S.cards.forEach(cd=>{const f=fatura(cd,m);if(f.total>0&&f.venc>=HOJE&&f.venc<=lim)ev.push({d:f.venc,t:'Fatura '+cd.nome+(f.status==='aberta'?' (prevista)':''),v:f.total,paga:f.paga,fat:[cd.id,m]});});
  }
  ev.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(b.pos||0)-(a.pos||0));
  h+='<section class="panel a-agenda"><div class="panel-h"><span class="panel-t">Próximas datas</span><span class="note">salários e vencimentos</span></div>';
  if(!ev.length)h+='<div class="empty">Nada nos próximos 40 dias.</div>';
  ev.slice(0,9).forEach(e=>{
    h+='<button class="row'+(e.pos?' hl':'')+'" '+(e.fat?'data-act="gofat" data-card="'+e.fat[0]+'" data-comp="'+e.fat[1]+'"':'data-act="noop"')+'><span class="date">'+ddmm(e.d)+'</span><span class="grow"><span class="t">'+esc(e.t)+'</span></span>'+(e.paga?'<span class="chip-status st-paga">PAGA</span>':'')+'<span class="v'+(e.pos?' pos':'')+'">'+(e.pos?'+':'−')+brl0(e.v)+'</span></button>';
  });
  h+='</section>';

  // cartões
  let best=null,worst=null;
  const info=S.cards.map(cd=>{const cl=fechamentoDe(cd,HOJE),vc=vencDoFechamento(cd,cl),comp=addM(vc.slice(0,7),cd.compOffset||0);const op=openDaFatura(cd,comp);
    const f=fatura(cd,comp);const gasto=f.itens.filter(x=>x.kind!=='parcela').reduce((a,x)=>a+x.valor,0);const parc=f.itens.filter(x=>x.kind==='parcela').reduce((a,x)=>a+x.valor,0);
    const span=Math.max(1,daysBetween(op,cl)),pct=Math.min(100,Math.max(0,daysBetween(op,HOJE)/span*100));
    const o={cd,cl,vc,comp,gasto,parc,pct,prazo:daysBetween(HOJE,vc)};
    if(!best||o.prazo>best.prazo)best=o;if(!worst||o.prazo<worst.prazo)worst=o;return o;});

      h+='<button class="ccard'+(isB?' best':'')+'" data-act="gofat" data-card="'+o.cd.id+'" data-comp="'+o.comp+'"><span class="nm"><span>'+esc(o.cd.nome)+'</span>'+(isB?'<span class="badge-best">MELHOR HOJE</span>':'')+'</span>'+
        '<span class="amt">R$ '+brl0(o.gasto)+'</span><span class="track"><i style="width:'+o.pct.toFixed(0)+'%"></i></span>'+
        '<span class="sub">'+(isB?'Compra hoje só vence '+ddmm(o.vc)+' ('+o.prazo+' dias)':'Fecha '+ddmm(o.cl)+' · vence '+ddmm(o.vc))+(o.parc?' · + R$ '+brl0(o.parc)+' em parcelas':'')+'</span></button>';});
    h+='</div></div>';
  }

  // termômetro e metas
  h+='<div class="a-termo">'+termometro(c,6,true)+'</div><div class="a-metas">'+metasBloco(c,4,false)+'</div></div>';
  return h;
}
function termometro(c,n,compact){
  const vals=[];for(let k=0;k<n;k++){const m=addM(c,k);vals.push([m,parcelasPorComp(m)]);}
  const max=Math.max(...vals.map(v=>v[1]),1);
  let alivio=null;for(let k=1;k<vals.length;k++){if(vals[k][1]<=vals[0][1]*0.5){alivio=vals[k][0];break;}}
  let h='<section class="panel"><div class="panel-h"><span class="panel-t">'+(compact?'Parcelas nos próximos meses':'Quando as parcelas aliviam')+'</span><span class="note" style="font-weight:700;color:var(--accent)">'+(alivio?'Alívio em '+mesCurto(alivio):(vals[0][1]?'Sem alívio forte em '+n+' meses':'Sem parcelas'))+'</span></div><div class="bars" role="img" aria-label="Parcelas por mês">';
  vals.forEach(([m,v])=>{const r=v/max;const col=r>.8?'var(--warn)':r>.6?'var(--warn-2)':r>.4?'var(--warn-3)':'var(--calm)';
    h+='<div class="col'+(m===alivio?' on':'')+'"><span class="bv">'+(v?k1(v):'—')+'</span><span class="b" style="height:'+Math.max(3,r*82).toFixed(0)+'px;background:'+(m===alivio?'var(--accent)':col)+'"></span><span class="bl">'+mesCurto(m).slice(0,3)+'</span></div>';});
  return h+'</div></section>';
}
function livreDe(comp){const t=totais(comp);return t.ent-t.saidas-(S.reserva.mensal||0);}
function metasRestantes(comp){
  const g=gastoPorCat(comp);let r=0;
  Object.entries(S.metas||{}).forEach(([cat,lim])=>{r+=Math.max(0,lim-(g[cat]||0));});
  return r;
}
function livreComMetas(comp){return livreDe(comp)-metasRestantes(comp);}
function painelDisponibilidade(base,n){
  const vals=[];for(let k=0;k<n;k++){const m=addM(base,k);vals.push([m,livreComMetas(m)]);}
  const max=Math.max(...vals.map(v=>Math.abs(v[1])),1);
  const best=vals.reduce((a,b)=>b[1]>a[1]?b:a,vals[0]);
  const piores=vals.filter(v=>v[1]<0).length;
  const nota=piores?piores+' mês(es) no vermelho à frente — dá pra ajustar antes.':'Melhor mês pra uma folga maior: '+mesCurto(best[0])+' ('+brl0(best[1])+')';

    '<p class="note" style="margin:0 0 10px">Livre para gastar em cada mês, já descontando entradas, parcelas, fixos, reserva e o que falta gastar das metas (Fralda, Leite, Gasolina, Farmácia). Toque num mês pra abrir o Início daquela competência.</p>'+
    '<div class="bars" role="img" aria-label="Livre para gastar por mês, considerando metas">';
  vals.forEach(([m,v])=>{const neg=v<0;const r=Math.min(1,Math.abs(v)/max);
    const col=neg?'var(--warn)':(m===best[0]&&best[1]>0?'var(--accent)':'var(--calm)');
    h+='<button type="button" class="col" data-act="gocomp" data-v="'+m+'"><span class="bv'+(neg?' neg':'')+'">'+(neg?'−':'')+k1(Math.abs(v))+'</span><span class="b" style="height:'+Math.max(3,r*82).toFixed(0)+'px;background:'+col+'"></span><span class="bl">'+mesCurto(m).slice(0,3)+'</span></button>';});
  h+='</div><p class="note" style="margin:10px 0 0;font-weight:700;color:'+(piores?'var(--warn-ink)':'var(--accent)')+'">'+nota+'</p></section>';

/* ───────── simulador de parcelamento (não lança nada de verdade, só projeta) ───────── */
function simParcelaValor(sim,comp){
  if(!sim)return 0;const val=num(sim.valor),n=Math.max(1,parseInt(sim.n)||1);
  if(!(val>0))return 0;
  const card=cardById(sim.conta);
  const f1=card?faturaDe(card,sim.data||HOJE):(sim.data||HOJE).slice(0,7);
  const i=diffM(f1,comp);
  return (i>=0&&i<n)?val:0;
}

  }
  return h;
}

const num=s=>{if(s==null)return 0;const t=String(s).trim().replace(/\s/g,'');const n=parseFloat(t.includes(',')?t.replace(/\./g,'').replace(',','.'):t);return isNaN(n)?0:n;};

function previewTxt(){
  const F=ui.form;const card=cardById(F.conta);const val=num(F.valor);
  if(F.tipo==='gasto'){
    if(!F.data)return '';
    if(!card)return 'Sai da conta em '+ddmm(F.data)+'<small>Entra na competência de '+mesNome(F.data.slice(0,7))+'.</small>';
    const vc=vencDe(card,F.data),cl=fechamentoDe(card,F.data);
    let bestTxt='';if(F.data===HOJE&&S.cards.length>1){let b=null;S.cards.forEach(c=>{const x=vencDe(c,HOJE);if(!b||x>b.x)b={c,x};});if(b.c.id!==card.id)bestTxt='<small>Dica: no '+esc(b.c.nome)+' essa compra só venceria '+ddmm(b.x)+'.</small>';}
    return 'Cai na fatura de '+mesNome(faturaDe(card,F.data))+' do '+esc(card.nome)+' · fecha '+ddmm(cl)+', vence '+ddmm(vc)+bestTxt;
  }
  if(F.tipo==='parcelado'){
    const vals=F.valoresTxt.trim()?F.valoresTxt.split(/[;\n]+/).map(num).filter(x=>x>0):null;
    const n=vals?vals.length:Math.max(1,parseInt(F.n)||1);
    const vp=vals?vals[0]:(F.modo==='total'?val/n:val);
    const f1=F.fatura1&&F.editId?F.fatura1:(card?faturaDe(card,F.data||HOJE):(F.data||HOJE).slice(0,7));
    return (vals?'Valores variam: '+vals.map(brl0).join(' → '):n+'× de R$ '+brl(vp||0))+'<small>1ª parcela na fatura de '+mesAno(f1)+' · última em '+mesAno(addM(f1,n-1))+'</small>';
  }
  if(F.tipo==='fixo'){return 'R$ '+brl(val)+' todo dia '+(parseInt(F.dia)||1)+(card?' no '+esc(card.nome):' na conta')+'<small>A partir de '+mesAno(F.inicio)+(F.fim?' até '+mesAno(F.fim):', sem data de fim')+'</small>';}
  if(F.tipo==='entrada'){const fim=F.freq==='mensal'?null:F.freq==='unica'?F.inicio:addM(F.inicio,Math.max(1,parseInt(F.nmeses)||1)-1);
    return 'Entra R$ '+brl(val)+' no dia '+(parseInt(F.dia)||1)+'<small>'+(F.freq==='mensal'?'Todo mês, a partir de '+mesAno(F.inicio):F.freq==='unica'?'Só em '+mesAno(F.inicio):mesAno(F.inicio)+' até '+mesAno(fim))+'</small>';}
  return '';
}
function renderSheet(){
  const root=document.getElementById('sheet-root');
  if(!ui.form){root.innerHTML='';return;}
  const F=ui.form,ed=!!F.editId;
  const TIP=[['gasto','Gasto'],['parcelado','Parcelado'],['fixo','Fixo'],['entrada','Entrada']];
  let h='<div class="sheet-bg" data-act="closebg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><span class="grab"></span>'+
    '<div class="sheet-h"><h2 id="sheet-title">'+(ed?'Editar lançamento':'Novo lançamento')+'</h2><button class="icon-btn" data-act="close" aria-label="Fechar">'+I.x+'</button></div>';
  h+='<div class="segm">'+TIP.map(([k,l])=>'<button class="'+(F.tipo===k?'on':'')+'" data-act="ftipo" data-v="'+k+'"'+(ed?' disabled':'')+'>'+l+'</button>').join('')+'</div>';
  h+='<div class="field"><label for="f-desc">Descrição</label><input class="inp" id="f-desc" data-act="fin" autocomplete="off" placeholder="'+(F.tipo==='entrada'?'Ex.: Salário, 13º, reembolso':'Ex.: Mercado, Pampers, Uber')+'" value="'+esc(F.desc)+'"></div>';
  const valLbl=F.tipo==='parcelado'?(F.modo==='total'?'Valor total (R$)':'Valor da parcela (R$)'):'Valor (R$)';
  h+='<div class="field"><label for="f-valor">'+valLbl+'</label><input class="inp money" id="f-valor" data-act="fin" inputmode="decimal" placeholder="0,00" value="'+esc(F.valor)+'"></div>';
  if(F.tipo==='parcelado')h+='<div class="segm two">'+[['total','Informar total'],['parcela','Informar parcela']].map(([k,l])=>'<button class="'+(F.modo===k?'on':'')+'" data-act="fmodo" data-v="'+k+'">'+l+'</button>').join('')+'</div>';
  if(F.tipo==='gasto'||F.tipo==='parcelado'){
    h+='<div class="frow"><div class="field"><label for="f-conta">Pagamento</label><select class="inp" id="f-conta" data-act="fin">'+contaOptions(F.conta)+'</select></div><div class="field"><label for="f-data">'+(F.tipo==='gasto'?'Data':'Data da compra')+'</label><input class="inp" type="date" id="f-data" data-act="fin" value="'+esc(F.data)+'"></div></div>';
    if(F.tipo==='parcelado')h+='<div class="field"><label for="f-n">Número de parcelas</label><input class="inp num" type="number" min="1" max="48" id="f-n" data-act="fin" value="'+esc(F.n)+'"></div>'+
      '<div class="field"><label for="f-valoresTxt">Valores diferentes por mês? (opcional)</label><textarea class="inp" id="f-valoresTxt" data-act="fin" placeholder="Ex.: 553,67; 253,66; 158,34 — para compras consolidadas">'+esc(F.valoresTxt)+'</textarea></div>';
  }
  if(F.tipo==='fixo'){
    h+='<div class="frow"><div class="field"><label for="f-dia">Dia do mês</label><input class="inp num" type="number" min="1" max="31" id="f-dia" data-act="fin" value="'+esc(F.dia)+'"></div><div class="field"><label for="f-conta">Pagamento</label><select class="inp" id="f-conta" data-act="fin">'+contaOptions(F.conta)+'</select></div></div>'+
      '<div class="frow"><div class="field"><label for="f-inicio">Começa em</label><select class="inp" id="f-inicio" data-act="fin">'+monthOptions(F.inicio,-8,12)+'</select></div><div class="field"><label for="f-fim">Termina em</label><select class="inp" id="f-fim" data-act="fin">'+monthOptions(F.fim,-8,36,true)+'</select></div></div>';
  }
  if(F.tipo==='entrada'){
    h+='<div class="frow"><div class="field"><label for="f-dia">Dia que cai</label><input class="inp num" type="number" min="1" max="31" id="f-dia" data-act="fin" value="'+esc(F.dia)+'"></div><div class="field"><label for="f-inicio">A partir de</label><select class="inp" id="f-inicio" data-act="fin">'+monthOptions(F.inicio,-8,12)+'</select></div></div>'+
      '<div class="frow"><div class="field"><label for="f-freq">Repete?</label><select class="inp" id="f-freq" data-act="fin"><option value="mensal"'+(F.freq==='mensal'?' selected':'')+'>Todo mês</option><option value="n"'+(F.freq==='n'?' selected':'')+'>Por alguns meses</option><option value="unica"'+(F.freq==='unica'?' selected':'')+'>Só uma vez</option></select></div>'+
      (F.freq==='n'?'<div class="field"><label for="f-nmeses">Quantos meses</label><input class="inp num" type="number" min="1" max="60" id="f-nmeses" data-act="fin" value="'+esc(F.nmeses)+'"></div>':'<div></div>')+'</div>';
  }
  if(F.tipo!=='entrada')h+='<div class="frow"><div class="field"><label for="f-cat">Categoria</label><select class="inp" id="f-cat" data-act="fin">'+CATS.map(c=>'<option'+(F.cat===c?' selected':'')+'>'+c+'</option>').join('')+'</select></div><div class="field"><label>Quem</label><div class="segm two" style="padding:3px">'+[['T','Thiago'],['N','Nataly']].map(([k,l])=>'<button class="'+(F.quem===k?'on':'')+'" data-act="fquem" data-v="'+k+'" style="height:38px">'+l+'</button>').join('')+'</div></div></div>';
  h+='<div class="preview" id="f-preview" aria-live="polite">'+previewTxt()+'</div>';
  h+='<p class="note" id="f-erro" style="color:var(--warn-ink);margin:0" hidden></p>';
  h+='<div class="btns">'+(ed?'<button class="btn danger'+(ui.confirm==='del'?' arm':'')+'" data-act="fdel">'+(ui.confirm==='del'?'Excluir mesmo':'Excluir')+'</button>':'<button class="btn" data-act="fsave" data-novo="1">Salvar e novo</button>')+'<button class="btn primary" data-act="fsave">Salvar</button></div>';
  h+='</div></div>';
  root.innerHTML=h;
}
function saveForm(novo){
  const F=readForm();const val=num(F.valor);const err=document.getElementById('f-erro');
  const fail=m=>{err.textContent=m;err.hidden=false;};
  if(!F.desc.trim())return fail('Dê um nome ao lançamento.');
  const vals=(F.tipo==='parcelado'&&F.valoresTxt.trim())?F.valoresTxt.split(/[;\n]+/).map(num).filter(x=>x>0):null;
  if(!vals&&!(val>0))return fail('Informe um valor maior que zero.');
  let L={id:F.editId||S.nid++,tipo:F.tipo,desc:F.desc.trim(),quem:F.quem||S.quem};
  if(F.tipo==='gasto')Object.assign(L,{valor:val,conta:F.conta,data:F.data||HOJE,cat:F.cat});
  if(F.tipo==='parcelado'){const n=vals?vals.length:Math.max(1,parseInt(F.n)||1);
    Object.assign(L,{conta:F.conta,data:F.data||HOJE,cat:F.cat,n,valores:vals,valor:vals?vals[0]:(F.modo==='total'?Math.round(val/n*100)/100:val)});
    if(F.editId&&F.fatura1){const old=S.lanc.find(x=>x.id===F.editId);if(old&&old.data===L.data&&old.conta===L.conta)L.fatura1=F.fatura1;}}
  if(F.tipo==='fixo')Object.assign(L,{valor:val,conta:F.conta,cat:F.cat,dia:Math.min(31,Math.max(1,parseInt(F.dia)||1)),inicio:F.inicio,fim:F.fim||null});
  if(F.tipo==='entrada'){const n=Math.max(1,parseInt(F.nmeses)||1);Object.assign(L,{valor:val,cat:'Renda',dia:Math.min(31,Math.max(1,parseInt(F.dia)||1)),inicio:F.inicio,fim:F.freq==='mensal'?null:F.freq==='unica'?F.inicio:addM(F.inicio,n-1)});}
  if(F.editId){const i=S.lanc.findIndex(x=>x.id===F.editId);S.lanc[i]=L;}else S.lanc.push(L);
  save();toast(F.editId?'Lançamento atualizado':'Lançamento salvo');
  if(novo){const keep={tipo:F.tipo,conta:F.conta,data:F.data,quem:F.quem,cat:F.cat,modo:F.modo,inicio:F.inicio,dia:F.dia};openForm(null,F.tipo);Object.assign(ui.form,keep,{desc:'',valor:'',valoresTxt:''});renderSheet();render(true);setTimeout(()=>{const e=document.getElementById('f-desc');if(e)e.focus();},30);}
  else{ui.form=null;renderSheet();render();}
}

/* ───────── render + eventos ───────── */
function render(keepScroll){
  memo={};
  const y=window.scrollY;
  const V={inicio:vInicio,lanc:vLanc,fat:vFat,plan:vPlan,ajustes:vAjustes}[ui.tab]||vInicio;
  document.getElementById('view').innerHTML=V();
  ['inicio','lanc','fat','plan'].forEach(t=>{const b=document.getElementById('tab-'+t);b.classList.toggle('on',ui.tab===t);b.setAttribute('aria-current',ui.tab===t?'page':'false');});
  ['inicio','lanc','fat','plan','ajustes'].forEach(t=>{const b=document.getElementById('side-'+t);if(b)b.classList.toggle('on',ui.tab===t);});
  if(keepScroll)window.scrollTo(0,y);
}
let toastT=null;
function toast(m){const r=document.getElementById('toast-root');r.innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';clearTimeout(toastT);toastT=setTimeout(()=>{r.innerHTML='';},2200);}

document.addEventListener('click',e=>{
  if(ui.compOpenId&&!e.target.closest('.compdd')){ui.compOpenId=null;render(true);}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='closebg'){if(e.target===el){ui.form=null;renderSheet();}return;}
  if(el.tagName==='SELECT'||el.tagName==='INPUT'||el.tagName==='TEXTAREA')return;
  switch(a){
    case 'compopen': ui.compOpenId=(ui.compOpenId===el.dataset.id)?null:el.dataset.id;render(true);break;
    case 'compset': ui.comp=el.dataset.v;ui.compOpenId=null;render(true);break;
    case 'compstep': ui.comp=addM(ui.comp,parseInt(el.dataset.dir,10));ui.compOpenId=null;render(true);break;
    case 'gocomp': ui.tab='inicio';ui.comp=el.dataset.v;ui.compOpenId=null;render();window.scrollTo(0,0);break;
    case 'tab': ui.tab=el.dataset.v;ui.confirm=null;ui.compOpenId=null;render();window.scrollTo(0,0);break;
    case 'novo': openForm(null,el.dataset.tipo);break;
    case 'edit': {const L=S.lanc.find(x=>x.id===+el.dataset.id);if(L)openForm(L);break;}
    case 'close': ui.form=null;renderSheet();break;
    case 'filtro': ui.filtro=el.dataset.v;render(true);break;
    case 'fatcard': ui.fatCard=el.dataset.v;render(true);break;
    case 'gofat': ui.tab='fat';ui.fatCard=el.dataset.card;ui.comp=el.dataset.comp;render();window.scrollTo(0,0);break;
    case 'pagar': {const k=el.dataset.card+'|'+el.dataset.comp;if(S.pagos[k])delete S.pagos[k];else S.pagos[k]=true;save();toast(S.pagos[k]?'Fatura marcada como paga':'Fatura voltou pra "a pagar"');render(true);break;}
    case 'ftipo': readForm();ui.form.tipo=el.dataset.v;if(el.dataset.v==='parcelado'&&!cardById(ui.form.conta)&&S.cards[0])ui.form.conta=S.cards[0].id;renderSheet();break;
    case 'fmodo': readForm();ui.form.modo=el.dataset.v;renderSheet();break;
    case 'fquem': readForm();ui.form.quem=el.dataset.v;renderSheet();break;
    case 'fsave': saveForm(!!el.dataset.novo);break;
    case 'fdel': if(ui.confirm!=='del'){ui.confirm='del';readForm();renderSheet();}else{S.lanc=S.lanc.filter(x=>x.id!==ui.form.editId);save();ui.form=null;ui.confirm=null;renderSheet();render(true);toast('Lançamento excluído');}break;
    case 'addmeta': {const s=document.getElementById('nova-meta-cat');if(s){S.metas[s.value]=500;save();render(true);}break;}
    case 'simclear': ui.sim=null;render(true);break;
    case 'addcard': {const id='c'+(S.nid++);S.cards.push({id,nome:'Novo cartão',fecha:10,vence:20});save();render(true);break;}
    case 'delcard': {const id=el.dataset.id;if(ui.confirm!=='card-'+id){ui.confirm='card-'+id;render(true);}else{S.cards=S.cards.filter(c=>c.id!==id);S.lanc.forEach(L=>{if(L.conta===id){L.conta='conta';delete L.fatura1;}});ui.confirm=null;save();render(true);toast('Cartão removido');}break;}
    case 'quem': S.quem=el.dataset.v;save();render(true);break;
    case 'reset': if(ui.confirm!=='reset'){ui.confirm='reset';render(true);}else{S=seed();save();ui.confirm=null;ui.comp=compPadrao();render();toast('Exemplo restaurado');}break;
    case 'zero': if(ui.confirm!=='zero'){ui.confirm='zero';render(true);}else{S.lanc=[];S.pagos={};S.exemplo=false;save();ui.confirm=null;render();toast('Tudo zerado — comece pelos cartões e entradas');}break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;const a=el.dataset&&el.dataset.act;if(!a)return;
  if(a==='comp'){ui.comp=el.value;render(true);}
  else if(a==='meta'){const v=num(el.value);if(v>0)S.metas[el.dataset.cat]=v;else delete S.metas[el.dataset.cat];save();render(true);}
  else if(a==='res'){S.reserva[el.dataset.k]=Math.max(0,num(el.value));save();render(true);}
  else if(a==='card'){const c=cardById(el.dataset.id);if(!c)return;const k=el.dataset.k;
    if(k==='nome')c.nome=el.value.trim()||c.nome;else{const d=Math.min(31,Math.max(1,parseInt(el.value)||1));c[k]=d;}
    S.lanc.forEach(L=>{if(L.conta===c.id&&k!=='nome')delete L.fatura1;});save();render(true);toast('Cartão atualizado');}
  else if(a==='fin'){readForm();if(el.id==='f-freq'){renderSheet();return;}const p=document.getElementById('f-preview');if(p)p.innerHTML=previewTxt();}
  else if(a==='sim'){atualizarSim();}
});
function atualizarSim(){
  // nunca refaz o formulário inteiro aqui — só o bloco de resultados, senão perde o foco a cada tecla.
  readSim();
  const r=document.getElementById('sim-results');if(r)r.innerHTML=simResultsHtml();
}
function readSim(){
  ui.sim=ui.sim||{valor:'',n:3,conta:(S.cards[0]||{}).id||'conta',data:HOJE};
  const g=id=>{const e=document.getElementById(id);return e?e.value:undefined;};
  const v=g('sim-valor');if(v!==undefined)ui.sim.valor=v;
  const n=g('sim-n');if(n!==undefined)ui.sim.n=n;
  const c=g('sim-conta');if(c!==undefined)ui.sim.conta=c;
  const d=g('sim-data');if(d!==undefined)ui.sim.data=d;
  return ui.sim;
}
document.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset)return;
  if(el.dataset.act==='sim'){atualizarSim();return;}
  if(el.dataset.act!=='fin')return;
  readForm();
  if(el.id==='f-desc'&&!ui.form.editId){const s=sugereCat(el.value);const sel=document.getElementById('f-cat');if(s&&sel&&sel.value!==s){sel.value=s;ui.form.cat=s;}}
  const p=document.getElementById('f-preview');if(p)p.innerHTML=previewTxt();
  const err=document.getElementById('f-erro');if(err)err.hidden=true;
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.form){ui.form=null;renderSheet();}});

load();ui.comp=compPadrao();render();
startFirebaseSync();
})();
</script>

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW falhou ao registrar:',e));
  });
}
